<!--
  ventasMasivoUI.html — Procesamiento masivo de ventas Odoo → Pedidos CVA.
  Usa el mismo formato visual que el buscador de imágenes.
-->
<meta name="darkreader-lock">
<meta name="color-scheme" content="dark">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600&family=Barlow+Condensed:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  html, body { color-scheme: dark only !important; background: #1e2025 !important; }
  :root { color-scheme: dark only; }
  :root {
    --bg:#1e2025; --green:#00665e; --green-lt:#67b8af; --green-dark:#00403a;
    --orange:#C8973A; --text:#eef0f0;
    --text-2:rgba(238,240,240,0.7); --text-3:rgba(238,240,240,0.4); --muted:rgba(238,240,240,0.35);
    --err:#e57373; --ok:#67b8af;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Barlow', sans-serif; margin:0; padding:24px; min-height:100vh; }
  h1 { font-family:'Barlow Condensed', sans-serif; font-weight:300; letter-spacing:6px; margin:0 0 4px; font-size:28px; }
  .sub { color:var(--text-3); font-size:11px; letter-spacing:2px; text-transform:uppercase; margin-bottom:18px; }

  /* Tarjeta info saldo */
  .saldo-card { display:flex; align-items:center; gap:24px; background:rgba(0,0,0,0.18); border:1px solid rgba(255,255,255,0.06); border-radius:14px; padding:16px 22px; margin-bottom:14px; }
  .saldo-card .label { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--text-3); }
  .saldo-card .valor { font-family:'Barlow Condensed', sans-serif; font-size:32px; font-weight:300; letter-spacing:3px; color:var(--green-lt); }
  .saldo-card.bajo .valor { color:var(--orange); }
  .saldo-card.sin .valor  { color:var(--err); }

  .panel { background:rgba(0,0,0,0.18); border:1px solid rgba(255,255,255,0.06); border-radius:14px; padding:20px; margin-bottom:14px; }
  .row-actions { display:flex; gap:14px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  button { background:var(--green); border:none; color:white; padding:10px 22px; border-radius:8px; font-family:'Barlow Condensed', sans-serif; letter-spacing:2px; font-weight:500; font-size:13px; text-transform:uppercase; cursor:pointer; transition:background .2s; }
  button:hover { background:var(--green-lt); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  button.outline { background:transparent; border:1px solid var(--green-lt); color:var(--green-lt); }
  button.outline:hover { background:var(--green-dark); color:white; }
  label { font-size:12px; color:var(--text-2); letter-spacing:1px; text-transform:uppercase; }
  input[type=checkbox] { accent-color: var(--green-lt); transform: scale(1.2); margin-right:6px; vertical-align:middle; }

  /* Tabla — mismo estilo que imagenesUI */
  table.cap { width:100%; border-collapse:collapse; }
  table.cap thead th {
    text-align:left; padding:10px 12px; font-weight:500; color:var(--text-3);
    border-bottom:1px solid rgba(255,255,255,0.1); font-size:10px; letter-spacing:1.5px;
    text-transform:uppercase;
  }
  table.cap tbody td {
    padding:9px 12px; border-bottom:1px solid rgba(255,255,255,0.05);
    font-size:13px;
  }
  table.cap tbody tr:hover { background:rgba(255,255,255,0.02); }
  td.num { font-variant-numeric:tabular-nums; text-align:right; }
  td.center { text-align:center; }
  .badge { padding:2px 8px; border-radius:10px; font-size:10px; letter-spacing:1px; text-transform:uppercase; display:inline-block; }
  .badge.pend { background:rgba(200,151,58,0.18); color:var(--orange); }
  .badge.ok   { background:rgba(103,184,175,0.18); color:var(--ok); }
  .badge.err  { background:rgba(229,115,115,0.18); color:var(--err); }
  .badge.test { background:rgba(255,255,255,0.08); color:var(--text-2); }
  /* Estatus Odoo */
  .badge.odoo-draft  { background:rgba(255,255,255,0.10); color:var(--text-2); }
  .badge.odoo-sale   { background:rgba(103,184,175,0.18); color:var(--ok); }
  .badge.odoo-done   { background:rgba(103,150,220,0.20); color:#8fb4e8; }
  .badge.odoo-cancel { background:rgba(229,115,115,0.18); color:var(--err); }
  .badge.odoo-none   { background:rgba(255,255,255,0.05); color:var(--text-3); }

  a { color:var(--green-lt); text-decoration:none; font-size:12px; }
  a:hover { text-decoration:underline; }
  .spinner { display:inline-block; width:12px; height:12px; border:2px solid var(--green-lt); border-top-color:transparent; border-radius:50%; animation:spin 1s linear infinite; vertical-align:middle; margin-right:6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .msg { padding:9px 13px; border-radius:8px; font-size:13px; margin-top:10px; display:inline-block; }
  .msg.err { background:rgba(229,115,115,0.1); color:var(--err); border:1px solid rgba(229,115,115,0.3); }
  .msg.ok  { background:rgba(103,184,175,0.1); color:var(--ok);  border:1px solid rgba(103,184,175,0.3); }
  .msg.warn { background:rgba(200,151,58,0.1); color:var(--orange); border:1px solid rgba(200,151,58,0.3); }
  .empty { text-align:center; padding:40px; color:var(--text-3); font-size:14px; }
  .nmxt-col { font-family:'Barlow Condensed', sans-serif; color:var(--green-lt); font-weight:500; letter-spacing:1.5px; }
  .estado-cell { font-size:11px; }
  .check-cell { width:30px; }
</style>

<h1>TODOS LOS PEDIDOS</h1>
<div class="sub">Procesamiento masivo de ventas Odoo → CVA</div>

<!-- Tarjeta saldo -->
<div class="saldo-card" id="saldoBox">
  <div>
    <div class="label">Saldo CVA Dropship</div>
    <div class="valor" id="saldoVal">$0.00</div>
  </div>
  <div style="flex:1;"></div>
  <div style="color:var(--text-3); font-size:11px; letter-spacing:1px;">
    Si el saldo cae por debajo de <b>$5,000</b>, recibirás alerta automática
  </div>
</div>

<div class="panel">
  <div class="row-actions">
    <button id="btnTraer" onclick="traer()">↻ Cargar ventas pendientes</button>
    <button id="btnProcesar" class="outline" onclick="procesar()" disabled>Procesar envíos seleccionados</button>
    <label><input type="checkbox" id="chkTest"> Modo de prueba (test=1)</label>
    <span id="estado" style="margin-left:14px;"></span>
  </div>
  <table class="cap" id="tabla">
    <thead>
      <tr>
        <th class="check-cell"><input type="checkbox" id="chkAll" onclick="toggleAll(this)"></th>
        <th>SO</th>
        <th>SKU</th>
        <th>Paquetería</th>
        <th>Guía</th>
        <th>NMXT</th>
        <th class="num" style="text-align:right;">Costo</th>
        <th>Estatus Odoo</th>
        <th>Estado</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div id="vacio" class="empty" style="display:none;">No hay ventas pendientes. Todas están enviadas o la hoja está vacía.</div>
</div>

<script>
  var VENTAS = [];

  function runS1(fn, ...args) {
    return new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function (e) { reject(e.message || e); })
        [fn].apply(google.script.run, args);
    });
  }

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function fmtMx(n){
    var v = parseFloat(n) || 0;
    return '$' + v.toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function setEstado(html){ document.getElementById('estado').innerHTML = html; }
  function actualizarSaldo(saldo){
    var box = document.getElementById('saldoBox');
    document.getElementById('saldoVal').textContent = fmtMx(saldo);
    box.classList.remove('bajo', 'sin');
    if (saldo <= 0) box.classList.add('sin');
    else if (saldo < 5000) box.classList.add('bajo');
  }

  function traer(){
    document.getElementById('btnTraer').disabled = true;
    setEstado('<span class="spinner"></span> Cargando ventas pendientes…');
    runS1('listarVentasPendientes').then(function(r){
      document.getElementById('btnTraer').disabled = false;
      if (!r || !r.ok){
        setEstado('<span class="msg err">'+(r && r.error ? esc(r.error) : 'Error')+'</span>');
        return;
      }
      VENTAS = r.ventas || [];
      actualizarSaldo(r.saldo || 0);
      pintarTabla();
      setEstado('<span class="msg ok">'+VENTAS.length+' venta(s) pendiente(s).</span>');
    }).catch(function(e){
      document.getElementById('btnTraer').disabled = false;
      setEstado('<span class="msg err">'+esc(e)+'</span>');
    });
  }

  function badgeOdoo(v){
    var e = String(v||'').trim().toLowerCase();
    if (!e || e === '-') return '<span class="badge odoo-none">\u2014</span>';
    if (/cancel/.test(e))          return '<span class="badge odoo-cancel">Cancelado</span>';
    if (/done/.test(e))            return '<span class="badge odoo-done">Entregado</span>';
    if (/sale|venta/.test(e))      return '<span class="badge odoo-sale">Confirmado</span>';
    if (/draft|borrador|sent|cotiz/.test(e)) return '<span class="badge odoo-draft">Borrador</span>';
    return '<span class="badge odoo-draft">'+esc(v)+'</span>';
  }

  function pintarTabla(){
    var tbody = document.getElementById('tbody');
    document.getElementById('vacio').style.display = VENTAS.length === 0 ? '' : 'none';
    tbody.innerHTML = VENTAS.map(function(v, i){
      var guiaLink = v.guia ? '<a href="'+esc(v.guia)+'" target="_blank">📄 Ver</a>' : '<span style="color:var(--text-3); font-size:11px;">—</span>';
      var nmxtVal = v.nmxt ? '<span class="nmxt-col">'+esc(v.nmxt)+'</span>' : '<span style="color:var(--text-3); font-size:11px;">—</span>';
      var estadoBadge;
      if (/sin saldo/i.test(v.estado)) estadoBadge = '<span class="badge err">SIN SALDO</span>';
      else if (/error/i.test(v.estado)) estadoBadge = '<span class="badge err">'+esc(v.estado).substr(0,30)+'</span>';
      else if (/enviado/i.test(v.estado)) estadoBadge = '<span class="badge ok">'+esc(v.estado)+'</span>';
      else if (v.estado) estadoBadge = '<span class="badge pend">'+esc(v.estado)+'</span>';
      else estadoBadge = '<span class="badge pend">Pendiente</span>';
      return '<tr>'
        + '<td class="check-cell"><input type="checkbox" class="rowCheck" data-fila="'+v.fila+'" onchange="actualizarBtnProcesar()"></td>'
        + '<td>'+esc(v.so)+'</td>'
        + '<td style="font-family:monospace; font-size:11px;">'+esc(v.sku)+'</td>'
        + '<td>'+esc(v.paqueteria||'')+'</td>'
        + '<td>'+guiaLink+'</td>'
        + '<td>'+nmxtVal+'</td>'
        + '<td class="num">'+(v.costo ? fmtMx(v.costo) : '—')+'</td>'
        + '<td class="estado-cell">'+badgeOdoo(v.estado_odoo)+'</td>'
        + '<td class="estado-cell">'+estadoBadge+'</td>'
        + '</tr>';
    }).join('');
    document.getElementById('chkAll').checked = false;
    actualizarBtnProcesar();
  }

  function toggleAll(chk){
    document.querySelectorAll('.rowCheck').forEach(function(c){ c.checked = chk.checked; });
    actualizarBtnProcesar();
  }

  function actualizarBtnProcesar(){
    var n = document.querySelectorAll('.rowCheck:checked').length;
    var btn = document.getElementById('btnProcesar');
    btn.disabled = (n === 0);
    btn.textContent = n > 0 ? ('Procesar envíos (' + n + ')') : 'Procesar envíos seleccionados';
  }

  function procesar(){
    var test = document.getElementById('chkTest').checked;
    var seleccionadas = [];
    document.querySelectorAll('.rowCheck:checked').forEach(function(c){
      seleccionadas.push(parseInt(c.dataset.fila, 10));
    });
    if (!seleccionadas.length) return;

    document.getElementById('btnProcesar').disabled = true;
    document.getElementById('btnTraer').disabled = true;

    // Procesar en lotes de 5 filas
    var LOTE = 5;
    var lotes = [];
    for (var i = 0; i < seleccionadas.length; i += LOTE) {
      lotes.push(seleccionadas.slice(i, i + LOTE));
    }

    var loteIdx = 0;
    var totalOk = 0, totalErr = 0, totalSinSaldo = 0;

    function siguiente(){
      if (loteIdx >= lotes.length) {
        document.getElementById('btnProcesar').disabled = false;
        document.getElementById('btnTraer').disabled = false;
        setEstado('<span class="msg ok">Procesados: ' + totalOk + ' ok'
          + (totalErr ? ', '+totalErr+' error' : '')
          + (totalSinSaldo ? ', '+totalSinSaldo+' sin saldo' : '')
          + '. Recarga la lista para ver los datos actualizados.</span>');
        traer();
        return;
      }
      var lote = lotes[loteIdx];
      loteIdx++;
      setEstado('<span class="spinner"></span> Procesando lote ' + loteIdx + ' de ' + lotes.length
        + ' (' + lote.length + ' fila' + (lote.length>1?'s':'') + ')…');
      runS1('procesarVentasMasivo', { filas: lote, test: test }).then(function(r){
        if (!r || !r.ok){
          setEstado('<span class="msg err">'+(r && r.error ? esc(r.error) : 'Error')+'</span>');
          document.getElementById('btnProcesar').disabled = false;
          document.getElementById('btnTraer').disabled = false;
          return;
        }
        (r.resultados || []).forEach(function(res){
          if (res.ok) totalOk++;
          else if (/sin saldo/i.test(res.error||'')) totalSinSaldo++;
          else totalErr++;
        });
        if (typeof r.saldo_final === 'number') actualizarSaldo(r.saldo_final);
        siguiente();
      }).catch(function(e){
        setEstado('<span class="msg err">'+esc(e)+'</span>');
        document.getElementById('btnProcesar').disabled = false;
        document.getElementById('btnTraer').disabled = false;
      });
    }
    siguiente();
  }

  // Auto-carga al abrir
  traer();
</script>
